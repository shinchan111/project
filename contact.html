<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Travel Explorer</title>

    <meta name="description"
          content="Contact Travel Explorer for travel information,
          suggestions and enquiries.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Us</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get In Touch</h2>

            <p>
                If you have any questions or suggestions, feel free to contact us.
            </p>

            <p><strong>Email:</strong> travel@example.com</p>

            <p><strong>Phone:</strong> +91 98765 43210</p>

            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message"
                          rows="5" cols="30"></textarea><br><br>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Travel Explorer. All Rights Reserved.</p>
    </footer>

</body>
</html>
